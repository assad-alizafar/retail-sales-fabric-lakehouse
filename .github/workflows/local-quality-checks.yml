name: Validate sample retail analytics pipeline
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r 4-Setup-and-Testing/requirements-local.txt
      - run: python -m pytest 4-Setup-and-Testing/automated_tests -q
      - run: python 4-Setup-and-Testing/local_python/run_local_demo.py --source 2-Sample-Retail-Data --output 3-Project-Results/local-run
